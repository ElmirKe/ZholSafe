// Pure-JVM module: NO Android dependencies allowed. Verified by unit tests running on the JVM.
plugins {
    id 'java-library'
}

group = 'kz.zholsafe'
version = '0.0.1-SNAPSHOT'

java {
    // Java 17 language level: records + sealed types, and fully supported by AGP 8 desugaring
    // on minSdk 26. (Java 21 is used server-side; Android toolchain support for 21 is not
    // assumed at this stage.)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.networknt:json-schema-validator:1.5.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

plugins {
    id 'com.android.application'
}

// :ort-adapter owns the ONNX Runtime version (ext.onnxRuntimeVersion); configure it first.
evaluationDependsOn(':ort-adapter')

android {
    namespace 'kz.zholsafe'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.zholsafe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Phones only: ONNX Runtime and MediaPipe ship native code for every ABI otherwise.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Model directories (models/road/<id>/{model.onnx,model-spec.json,labels.txt}) are copied
    // from the repository into generated assets at build time — never by hand. ONNX binaries are
    // git-ignored; if absent the app reports MODEL NOT AVAILABLE and never fakes detections.
    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/model-assets')
        }
    }

    androidResources {
        noCompress 'onnx', 'task'
    }
}

// Driver face model (Google AI Edge Face Landmarker, Apache-2.0). Not committed, like every model
// binary: downloaded once into models/driver/ and verified by SHA-256 before it is bundled.
def faceModelUrl = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
def faceModelSha256 = '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff'
def faceModelFile = rootProject.file('../models/driver/face_landmarker.task')

tasks.register('fetchFaceModel') {
    outputs.file(faceModelFile)
    onlyIf { !faceModelFile.exists() }
    doLast {
        logger.lifecycle("Downloading face model from $faceModelUrl")
        faceModelFile.parentFile.mkdirs()
        def tmp = new File(faceModelFile.path + '.part')
        new URL(faceModelUrl).withInputStream { input -> tmp.withOutputStream { it << input } }
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(tmp.bytes).encodeHex().toString()
        if (actual != faceModelSha256) {
            tmp.delete()
            throw new GradleException("face_landmarker.task SHA-256 mismatch: $actual")
        }
        tmp.renameTo(faceModelFile)
    }
}

tasks.register('syncModelAssets', Copy) {
    dependsOn 'fetchFaceModel'
    from(rootProject.file('../models')) {
        include 'road/**'
        include 'driver/face_landmarker.task'
        exclude '**/README.md'
    }
    into layout.buildDirectory.dir('generated/model-assets/models')
}
preBuild.dependsOn syncModelAssets

// ONNX Runtime version is centralised in :ort-adapter (Stage 2.5).
def onnxRuntimeVersion = project(':ort-adapter').ext.onnxRuntimeVersion

dependencies {
    implementation project(':core')
    implementation project(':ort-adapter')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX (Stage 1): Preview + ImageAnalysis only. Stable 1.3.x line; no camera-extensions/video.
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    // Location — Stage 6 (declared early; unused in Stage 1).
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Google AI Edge (MediaPipe) Face Landmarker for DriverGuard. On-device only — no network.
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // ONNX Runtime (official Android AAR, Java API). Local inference only — no network.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:$onnxRuntimeVersion"

    testImplementation 'junit:junit:4.13.2'
}

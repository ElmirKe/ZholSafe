plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.zholsafe'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.zholsafe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // ONNX Runtime ships native libs; keep the default packaging (added in Stage 2).
    }
}

dependencies {
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX — wired in Stage 1.
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    // Location — Stage 1/6.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ONNX Runtime (Java API, Android AAR) — enabled in Stage 2.
    // implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'

    testImplementation 'junit:junit:4.13.2'
}

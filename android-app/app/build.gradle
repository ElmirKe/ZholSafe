plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.zholsafe'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.zholsafe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Model directories (models/road/<id>/{model.onnx,model-spec.json,labels.txt}) are copied
    // from the repository into generated assets at build time — never by hand. ONNX binaries are
    // git-ignored; if absent the app reports MODEL NOT AVAILABLE and never fakes detections.
    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/model-assets')
        }
    }

    androidResources {
        noCompress 'onnx'
    }
}

tasks.register('syncModelAssets', Copy) {
    from(rootProject.file('../models')) {
        include 'road/**'
        exclude '**/README.md'
    }
    into layout.buildDirectory.dir('generated/model-assets/models')
}
preBuild.dependsOn syncModelAssets

// Centralised runtime versions (Stage 2).
def onnxRuntimeVersion = '1.19.2'

dependencies {
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX (Stage 1): Preview + ImageAnalysis only. Stable 1.3.x line; no camera-extensions/video.
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    // Location — Stage 6 (declared early; unused in Stage 1).
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ONNX Runtime (official Android AAR, Java API). Local inference only — no network.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:$onnxRuntimeVersion"

    testImplementation 'junit:junit:4.13.2'
}

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${ZHOLNET_DB_NAME:-zholnet}
      POSTGRES_USER: ${ZHOLNET_DB_USER:-zholnet}
      POSTGRES_PASSWORD: ${ZHOLNET_DB_PASSWORD:-change-me-for-local-demo}
    ports:
      - "${ZHOLNET_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - zholnet-postgis:/var/lib/postgresql/data

  zholnet-server:
    build: ./zholnet-server
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      ZHOLNET_DB_URL: jdbc:postgresql://postgis:5432/${ZHOLNET_DB_NAME:-zholnet}
      ZHOLNET_DB_USER: ${ZHOLNET_DB_USER:-zholnet}
      ZHOLNET_DB_PASSWORD: ${ZHOLNET_DB_PASSWORD:-change-me-for-local-demo}
    ports:
      - "${ZHOLNET_PORT:-8080}:8080"

volumes:
  zholnet-postgis:

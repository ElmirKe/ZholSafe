spring:
  application:
    name: zholnet-server
  datasource:
    url: ${ZHOLNET_DB_URL:jdbc:postgresql://localhost:5432/zholnet}
    username: ${ZHOLNET_DB_USER:zholnet}
    password: ${ZHOLNET_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${ZHOLNET_PORT:8080}

# EXPERIMENTAL / MVP CONFIGURATION — operational heuristics, not regulatory safety thresholds.
zholnet:
  hazards:
    default-ttl: ${ZHOLNET_DEFAULT_TTL:PT30M}
    cleanup-interval: ${ZHOLNET_CLEANUP_INTERVAL:PT5M}
    deduplication-window: ${ZHOLNET_DEDUP_WINDOW:PT8S}
    deduplication-radius-meters: ${ZHOLNET_DEDUP_RADIUS_METERS:12}
    maximum-nearby-radius-meters: ${ZHOLNET_MAX_NEARBY_RADIUS_METERS:10000}
    maximum-nearby-results: ${ZHOLNET_MAX_NEARBY_RESULTS:100}
    websocket-endpoint: ${ZHOLNET_WS_ENDPOINT:/ws/hazards}
    websocket-topic: ${ZHOLNET_WS_TOPIC:/topic/hazards}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    kz.zholsafe: INFO
